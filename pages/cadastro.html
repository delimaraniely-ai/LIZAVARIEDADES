<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro</title>

    <link rel="stylesheet" href="../style/cadastro.css">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header id="header">

        <div class="header-container">

            <img id="logo" alt="Logo">

            <h1 id="tituloPagina"></h1>

        </div>

    </header>

    <!-- ================= MAIN ================= -->

    <main id="main">

        <!-- Banner -->

        <section id="banner">

            <div class="banner-content">

                <h2 id="bannerTitulo"></h2>

                <p id="bannerDescricao"></p>

            </div>

        </section>

        <!-- Navegação -->

        <section id="navigation">

            <button id="btnLogin" class="nav-button">
            </button>

            <button id="btnCadastro" class="nav-button">
            </button>

        </section>

        <!-- Card Cadastro -->

        <section id="cadastroCard">

            <!-- Cabeçalho -->

            <div class="card-header">

                <div class="header-text">

                    <h2 id="tituloCadastro"></h2>

                    <p id="descricaoCadastro"></p>

                </div>



            </div>

            <!-- Formulário -->

            <form id="formCadastro">

                <div class="form-grid">

                    <!-- Nome -->

                    <div class="form-group">

                        <label id="lblNome" for="nome"></label>

                        <input id="nome" type="text">

                    </div>

                    <!-- CPF -->

                    <div class="form-group">

                        <label id="lblCpf" for="cpf"></label>

                        <input id="cpf" type="text">

                    </div>

                    <!-- Data -->

                    <div class="form-group">

                        <label id="lblNascimento" for="dataNascimento"></label>

                        <input id="dataNascimento" type="text">

                    </div>

                    <!-- Sexo -->



                    <!-- Email -->

                    <div class="form-group">

                        <label id="lblEmail" for="email"></label>

                        <input id="email" type="email">

                    </div>



                    <!-- Telefone -->

                    <div class="form-group">

                        <label id="lblTelefone" for="telefone"></label>

                        <input id="telefone" type="text">

                    </div>

                    <!-- Estado Civil -->







                </div>

            </form>

            <!-- Botões -->

            <div class="buttons">

                <button id="btnVoltar" type="button">
                    Voltar
                </button>

                <button id="btnCadastrar" type="button">
                    Cadastrar
                </button>

            </div>

        </section>

    </main>

    <!-- ================= FOOTER ================= -->

    <footer id="footer">

        <p id="footerTexto"></p>

    </footer>

    <!-- JavaScript -->

    <script src="/js/cadastro.js"></script>

</body>

</html>
