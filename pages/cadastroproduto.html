<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Produtos</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../STYLE/cadastroproduto.css">

</head>


<body>

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <div class="header-conteudo">

            <div class="logo-area">

                <a href="index.html">
                    LIZA VARIEDADES
                </a>

            </div>

            <div class="titulo-header">
                Cadastro de Produtos
            </div>

        </div>

    </header>


    <!-- =====================================================
         CONTEÚDO PRINCIPAL
    ====================================================== -->

    <main class="container">

        <!-- TÍTULO -->

        <div class="pagina-titulo">

            <h1>
                Cadastro de Produtos
            </h1>

            <p>
                Preencha os dados abaixo para cadastrar um novo produto.
            </p>

        </div>


        <!-- =================================================
             FORMULÁRIO
        ================================================== -->

        <form id="formCadastroProduto" class="formulario">


            <!-- =================================================
                 NOME
            ================================================== -->

            <div class="campo campo-full">

                <label for="nome">
                    Nome do produto
                    <span>*</span>
                </label>

                <input type="text" id="nome" name="nome" placeholder="Digite o nome do produto" required>

            </div>


            <!-- =================================================
                 DESCRIÇÃO
            ================================================== -->

            <div class="campo campo-full">

                <label for="descricao">
                    Descrição
                    <span>*</span>
                </label>

                <textarea id="descricao" name="descricao" placeholder="Digite a descrição do produto" rows="5"
                    required></textarea>

            </div>


            <!-- =================================================
                 CÓDIGO + ESTOQUE
            ================================================== -->

            <div class="linha">


                <!-- CÓDIGO -->

                <div class="campo">

                    <label for="codigo">
                        Código do produto
                        <span>*</span>
                    </label>

                    <input type="text" id="codigo" name="codigo" placeholder="Ex.: PROD001" required>

                </div>


                <!-- ESTOQUE -->

                <div class="campo">

                    <label for="quantidade_estoque">
                        Quantidade em estoque
                        <span>*</span>
                    </label>

                    <input type="number" id="quantidade_estoque" name="quantidade_estoque" min="0"
                        placeholder="Digite a quantidade" required>

                </div>

            </div>


            <!-- =================================================
                 PREÇOS
            ================================================== -->

            <div class="linha">


                <!-- PREÇO ANTIGO -->

                <div class="campo">

                    <label for="preco_antigo">
                        Preço antigo
                        <span>*</span>
                    </label>

                    <input type="number" id="preco_antigo" name="preco_antigo" min="0" step="0.01" placeholder="0,00"
                        required>

                </div>


                <!-- PREÇO PROMOCIONAL -->

                <div class="campo">

                    <label for="preco_promocional">
                        Preço promocional
                    </label>

                    <input type="number" id="preco_promocional" name="preco_promocional" min="0" step="0.01"
                        placeholder="0,00">

                </div>

            </div>


            <!-- =================================================
                 MARCA + CATEGORIA
            ================================================== -->

            <div class="linha">


                <!-- MARCA -->

                <div class="campo">

                    <label for="marca">
                        Marca
                        <span>*</span>
                    </label>

                    <select id="marca" name="marca" required>

                        <option value="">
                            Selecione uma marca
                        </option>

                    </select>

                </div>


                <!-- CATEGORIA -->

                <div class="campo">

                    <label for="categoria">
                        Categoria
                        <span>*</span>
                    </label>

                    <select id="categoria" name="categoria" required>

                        <option value="">
                            Selecione uma categoria
                        </option>

                    </select>

                </div>

            </div>


            <!-- =================================================
                 STATUS + LOJA
            ================================================== -->

            <div class="linha">


                <!-- STATUS -->

                <div class="campo">

                    <label for="ativo">
                        Status do produto
                        <span>*</span>
                    </label>

                    <select id="ativo" name="ativo" required>

                        <option value="1">
                            Ativo
                        </option>

                        <option value="0">
                            Inativo
                        </option>

                    </select>

                </div>


                <!-- LOJA -->

                <div class="campo">

                    <label for="loja">
                        Loja
                        <span>*</span>
                    </label>

                    <select id="loja" name="loja" required>

                        <option value="">
                            Selecione uma loja
                        </option>

                    </select>

                </div>

            </div>


            <!-- =================================================
                 MENSAGEM
            ================================================== -->

            <div id="mensagem" class="mensagem"></div>


            <!-- =================================================
                 BOTÕES
            ================================================== -->

            <div class="form-footer">

                <button type="reset" id="btnLimpar" class="btn btn-secundario">
                    Limpar
                </button>


                <button type="submit" id="btnCadastrar" class="btn btn-principal">
                    Cadastrar Produto
                </button>

            </div>


        </form>

    </main>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="footer">

        <p>
            © 2026 Liza Variedades - Todos os direitos reservados.
        </p>

    </footer>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="../JS/cadastroproduto.js"></script>

</body>

</html>
