<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home - Liza Variedades</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../style/home.css">

</head>


<body>


    <!-- =====================================================
         MENU SUPERIOR
    ====================================================== -->

    <header class="header">


        <!-- FAVORITOS -->

        <button id="btnFavoritos" class="icon-btn" type="button">
            ♡
        </button>


        <!-- PESQUISA -->

        <div class="search-box">

            <input type="text" id="campoBusca" placeholder="Pesquisar produtos...">

        </div>


        <!-- CARRINHO -->

        <button id="btnCarrinho" class="icon-btn" type="button">
            🛒
        </button>


        <!-- PERFIL -->

        <button id="btnPerfil" class="icon-btn" type="button">
            👤
        </button>


    </header>



    <!-- =====================================================
         CONTEÚDO PRINCIPAL
    ====================================================== -->

    <main>


        <!-- =================================================
             BANNER
        ================================================== -->

        <section class="banner-section">

            <img id="bannerPrincipal" src="" alt="Banner principal">

        </section>



        <!-- =================================================
             DESTAQUES
        ================================================== -->

        <section class="section-title">


            <h2>
                Destaques da Semana
            </h2>


            <div class="title-buttons">


                <button id="btnVerTodos1" type="button">
                    Ver Tudo
                </button>


                <button id="btnCategoria1" type="button">
                    Mais Vendidos
                </button>


            </div>


        </section>



        <!-- PRODUTOS DESTAQUE -->

        <section class="products-grid" id="produtosDestaque">


            <!-- PRODUTO 01 -->

            <article class="product-card">

                <img id="produtoImagem1" src="" alt="">

                <h3 id="produtoNome1"></h3>

                <span id="produtoPreco1"></span>

            </article>



            <!-- PRODUTO 02 -->

            <article class="product-card">

                <img id="produtoImagem2" src="" alt="">

                <h3 id="produtoNome2"></h3>

                <span id="produtoPreco2"></span>

            </article>



            <!-- PRODUTO 03 -->

            <article class="product-card">

                <img id="produtoImagem3" src="" alt="">

                <h3 id="produtoNome3"></h3>

                <span id="produtoPreco3"></span>

            </article>



            <!-- PRODUTO 04 -->

            <article class="product-card">

                <img id="produtoImagem4" src="" alt="">

                <h3 id="produtoNome4"></h3>

                <span id="produtoPreco4"></span>

            </article>



            <!-- PRODUTO 05 -->

            <article class="product-card">

                <img id="produtoImagem5" src="" alt="">

                <h3 id="produtoNome5"></h3>

                <span id="produtoPreco5"></span>

            </article>



            <!-- PRODUTO 06 -->

            <article class="product-card">

                <img id="produtoImagem6" src="" alt="">

                <h3 id="produtoNome6"></h3>

                <span id="produtoPreco6"></span>

            </article>


        </section>



        <!-- =================================================
             DESCONTOS
        ================================================== -->

        <section class="section-title">


            <h2>
                Produtos com Descontos
            </h2>


            <div class="title-buttons">


                <button id="btnVerTodos2" type="button">
                    Ver Tudo
                </button>


                <button id="btnCategoria2" type="button">
                    Promoções
                </button>


            </div>


        </section>



        <!-- PRODUTOS COM DESCONTO -->

        <section class="products-grid" id="produtosDesconto">


            <!-- PRODUTO 01 -->

            <article class="product-card">

                <img id="descontoImagem1" src="" alt="">

                <h3 id="descontoNome1"></h3>

                <span id="descontoPreco1"></span>

            </article>



            <!-- PRODUTO 02 -->

            <article class="product-card">

                <img id="descontoImagem2" src="" alt="">

                <h3 id="descontoNome2"></h3>

                <span id="descontoPreco2"></span>

            </article>



            <!-- PRODUTO 03 -->

            <article class="product-card">

                <img id="descontoImagem3" src="" alt="">

                <h3 id="descontoNome3"></h3>

                <span id="descontoPreco3"></span>

            </article>



            <!-- PRODUTO 04 -->

            <article class="product-card">

                <img id="descontoImagem4" src="" alt="">

                <h3 id="descontoNome4"></h3>

                <span id="descontoPreco4"></span>

            </article>



            <!-- PRODUTO 05 -->

            <article class="product-card">

                <img id="descontoImagem5" src="" alt="">

                <h3 id="descontoNome5"></h3>

                <span id="descontoPreco5"></span>

            </article>



            <!-- PRODUTO 06 -->

            <article class="product-card">

                <img id="descontoImagem6" src="" alt="">

                <h3 id="descontoNome6"></h3>

                <span id="descontoPreco6"></span>

            </article>


        </section>



        <!-- =================================================
             RESUMO DO PEDIDO
        ================================================== -->

        <section class="pedido-section">


            <h2>
                Resumo do Pedido
            </h2>


            <div class="pedido-grid">


                <div class="pedido-item">

                    <span>
                        Total Itens
                    </span>

                    <strong id="pedidoItens"></strong>

                </div>



                <div class="pedido-item">

                    <span>
                        Total Produtos
                    </span>

                    <strong id="pedidoProdutos"></strong>

                </div>



                <div class="pedido-item">

                    <span>
                        Total Pedido
                    </span>

                    <strong id="pedidoValor"></strong>

                </div>



                <div class="pedido-item">

                    <span>
                        Status
                    </span>

                    <strong id="pedidoStatus"></strong>

                </div>


            </div>


        </section>


    </main>



    <!-- =====================================================
         RODAPÉ
    ====================================================== -->

    <footer class="footer">


        <h3>
            Carrinho de Compras
        </h3>


        <button id="btnFinalizarCompra" type="button">
            Finalizar Pedido
        </button>


    </footer>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="../js/home.js"></script>


</body>

</html>
