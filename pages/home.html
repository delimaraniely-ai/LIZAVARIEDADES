<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Liza Variedades</title>

    <link rel="stylesheet" href="./home.html">
</head>

<body>

    <!-- MENU SUPERIOR -->

    <header class="header">

        <button id="btnFavoritos" class="icon-btn">♡</button>

        <div class="search-box">

            <input type="text" id="campoBusca" placeholder="Pesquisar produtos...">

        </div>

        <button id="btnCarrinho" class="icon-btn">🛒</button>

        <button id="btnPerfil" class="icon-btn">👤</button>

    </header>

    <!-- CONTEÚDO -->

    <main>

        <!-- BANNER -->

        <section class="banner-section">

            <img id="bannerPrincipal" src="" alt="">

        </section>

        <!-- DESTAQUES -->

        <section class="section-title">

            <h2>
                Destaques da Semana
            </h2>

            <div class="title-buttons">

                <button id="btnVerTodos1">
                    Ver Tudo
                </button>

                <button id="btnCategoria1">
                    Mais Vendidos
                </button>

            </div>

        </section>

        <section class="products-grid">

            <!-- PRODUTO 01 -->

            <article class="product-card">

                <img id="produtoImagem1" src="" alt="">

                <h3 id="produtoNome1"></h3>

                <span id="produtoPreco1"></span>

            </article>

            <!-- PRODUTO 02 -->

            <article class="product-card">

                <img id="produtoImagem2" src="" alt="">

                <h3 id="produtoNome2"></h3>

                <span id="produtoPreco2"></span>

            </article>

            <!-- PRODUTO 03 -->

            <article class="product-card">

                <img id="produtoImagem3" src="" alt="">

                <h3 id="produtoNome3"></h3>

                <span id="produtoPreco3"></span>

            </article>

            <!-- PRODUTO 04 -->

            <article class="product-card">

                <img id="produtoImagem4" src="" alt="">

                <h3 id="produtoNome4"></h3>

                <span id="produtoPreco4"></span>

            </article>

            <!-- PRODUTO 05 -->

            <article class="product-card">

                <img id="produtoImagem5" src="" alt="">

                <h3 id="produtoNome5"></h3>

                <span id="produtoPreco5"></span>

            </article>

            <!-- PRODUTO 06 -->

            <article class="product-card">

                <img id="produtoImagem6" src="" alt="">

                <h3 id="produtoNome6"></h3>

                <span id="produtoPreco6"></span>

            </article>

        </section>

        <!-- DESCONTOS -->

        <section class="section-title">

            <h2>
                Produtos com Descontos
            </h2>

            <div class="title-buttons">

                <button id="btnVerTodos2">
                    Ver Tudo
                </button>

                <button id="btnCategoria2">
                    Promoções
                </button>

            </div>

        </section>

        <section class="products-grid">

            <article class="product-card">

                <img id="descontoImagem1" src="" alt="">

                <h3 id="descontoNome1"></h3>

                <span id="descontoPreco1"></span>

            </article>

            <article class="product-card">

                <img id="descontoImagem2" src="" alt="">

                <h3 id="descontoNome2"></h3>

                <span id="descontoPreco2"></span>

            </article>

            <article class="product-card">

                <img id="descontoImagem3" src="" alt="">

                <h3 id="descontoNome3"></h3>

                <span id="descontoPreco3"></span>

            </article>

            <article class="product-card">

                <img id="descontoImagem4" src="" alt="">

                <h3 id="descontoNome4"></h3>

                <span id="descontoPreco4"></span>

            </article>

            <article class="product-card">

                <img id="descontoImagem5" src="" alt="">

                <h3 id="descontoNome5"></h3>

                <span id="descontoPreco5"></span>

            </article>

            <article class="product-card">

                <img id="descontoImagem6" src="" alt="">

                <h3 id="descontoNome6"></h3>

                <span id="descontoPreco6"></span>

            </article>

        </section>

        <!-- RESUMO PEDIDO -->

        <section class="pedido-section">

            <h2>
                Resumo do Pedido
            </h2>

            <div class="pedido-grid">

                <div class="pedido-item">

                    <span>Total Itens</span>

                    <strong id="pedidoItens"></strong>

                </div>

                <div class="pedido-item">

                    <span>Total Produtos</span>

                    <strong id="pedidoProdutos"></strong>

                </div>

                <div class="pedido-item">

                    <span>Total Pedido</span>

                    <strong id="pedidoValor"></strong>

                </div>

                <div class="pedido-item">

                    <span>Status</span>

                    <strong id="pedidoStatus"></strong>

                </div>

            </div>

        </section>

    </main>

    <!-- RODAPÉ -->

    <footer class="footer">

        <h3>
            Carrinho de Compras
        </h3>

        <button id="btnFinalizarCompra">
            Finalizar Pedido
        </button>

    </footer>

    <scriptsrc=" src="/js/home.js">
        </scriptsrc>
        </script>

</body>

</html>
