<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Localização - Liza Variedades</title>

    <link rel="stylesheet" href="../style/localizacao.css">

</head>

<body>

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <button id="btnVoltar" type="button">
            ←
        </button>

        <h1 id="tituloPagina"></h1>

        <button id="btnCompartilhar" type="button">
            ⤴
        </button>

    </header>


    <!-- =====================================================
         CONTEÚDO
    ====================================================== -->

    <main>


        <!-- =================================================
             MAPA
        ================================================== -->

        <section class="map-section">

            <img id="mapaImagem" src="" alt="Mapa da localização da loja">

            <div class="map-overlay">

                <button id="btnMinhaLocalizacao" type="button">
                    📍 Minha Localização
                </button>

            </div>

        </section>


        <!-- =================================================
             INFORMAÇÕES DA LOJA
        ================================================== -->

        <section class="location-card">

            <div class="location-icon">

                <img id="pinIcon" src="" alt="Localização">

            </div>

            <div class="location-info">

                <h2 id="nomeLoja"></h2>

                <p id="enderecoLoja"></p>

            </div>

        </section>


        <!-- =================================================
             DISTÂNCIA
        ================================================== -->

        <section class="distance-card">

            <div class="distance-item">

                <span class="label">
                    Distância
                </span>

                <strong id="distancia"></strong>

            </div>


            <div class="distance-item">

                <span class="label">
                    Tempo Estimado
                </span>

                <strong id="tempo"></strong>

            </div>

        </section>


        <!-- =================================================
             AÇÕES
        ================================================== -->

        <section class="actions-section">

            <button id="btnRota" class="btn-primary" type="button">
            </button>


            <button id="btnWaze" class="btn-secondary" type="button">
            </button>

        </section>


        <!-- =================================================
             STATUS
        ================================================== -->

        <section class="status-card">

            <div class="status-left">

                <span class="status-dot"></span>

                <span id="statusLoja"></span>

            </div>

            <span id="horarioLoja"></span>

        </section>

    </main>


    <!-- =====================================================
         RODAPÉ
    ====================================================== -->

    <footer class="footer">

        <button id="btnOutrasLojas" type="button">
        </button>

    </footer>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="../js/localizacao.js"></script>

</body>

</html>
