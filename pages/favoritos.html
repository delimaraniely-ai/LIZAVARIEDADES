<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meus Favoritos</title>

    <!-- CSS -->

    <link rel="stylesheet" href="../style/favoritos.css">

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <div class="voltar">

            <a href="home.html" id="btnVoltar">

                <i class="fa-solid fa-arrow-left"></i>

            </a>

        </div>


        <div class="titulo">

            <h2 id="tituloFavoritos">
                Meus Favoritos
            </h2>

        </div>


        <div class="carrinho">

            <a href="carrinho.html" id="btnCarrinho">

                <i class="fa-solid fa-cart-shopping"></i>

                <span id="contadorCarrinho">
                    0
                </span>

            </a>

        </div>

    </header>



    <!-- =====================================================
         PESQUISA
    ====================================================== -->

    <section class="pesquisa">

        <div class="campoPesquisa">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input type="text" id="pesquisar" placeholder="Buscar nos favoritos...">

        </div>

    </section>



    <!-- =====================================================
         QUANTIDADE
    ====================================================== -->

    <section class="informacoes">

        <p id="quantidadeFavoritos">
            0 produtos favoritos
        </p>

    </section>



    <!-- =====================================================
         CONTEÚDO
    ====================================================== -->

    <main>

        <!-- =================================================
             LISTA DE FAVORITOS
        ================================================== -->

        <section class="listaFavoritos" id="listaFavoritos">
        </section>



        <!-- =================================================
             LISTA VAZIA
        ================================================== -->

        <section class="vazio" id="listaVazia">

            <i class="fa-regular fa-heart"></i>


            <h3>
                Nenhum produto favorito
            </h3>


            <p>
                Adicione produtos aos favoritos
                para encontrá-los rapidamente.
            </p>


            <a href="home.html" class="btnVoltar">
                Continuar Comprando
            </a>

        </section>

    </main>



    <!-- =====================================================
         MENU INFERIOR
    ====================================================== -->

    <nav class="menuInferior">


        <a href="home.html">

            <i class="fa-solid fa-house"></i>

            <span>
                Início
            </span>

        </a>



        <a href="pesquisa.html">

            <i class="fa-solid fa-magnifying-glass"></i>

            <span>
                Pesquisar
            </span>

        </a>



        <a href="favoritos.html" class="ativo">

            <i class="fa-solid fa-heart"></i>

            <span>
                Favoritos
            </span>

        </a>



        <a href="perfil.html">

            <i class="fa-solid fa-user"></i>

            <span>
                Perfil
            </span>

        </a>

    </nav>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="../js/favoritos.js"></script>

</body>

</html>
